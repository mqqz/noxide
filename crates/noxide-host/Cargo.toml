[package]
name = "noxide-host"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Trusted Noxide application runtime"

[dependencies]
noxide-protocol.workspace = true
noxide-sandbox.workspace = true
noxide-keys.workspace = true
noxide-assets.workspace = true
noxide-admission.workspace = true
noxide-render.workspace = true
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
rustls.workspace = true
tokio-rustls.workspace = true
webpki-roots.workspace = true
httparse.workspace = true
rustix.workspace = true
tokio.workspace = true
sqlx = { version = "=0.8.6", default-features = false, features = ["runtime-tokio", "sqlite", "postgres"] }
axum = { version = "0.8", default-features = false, features = ["http1", "tokio"] }
hyper = { version = "1", features = ["http1", "server"] }
hyper-util = { version = "0.1", features = ["tokio", "service"] }
argon2 = "0.5"
rand = "0.8"
base64 = "0.22"
url = "2"

[features]
query-metrics = []

[dev-dependencies]
noxide-admission = { workspace = true, features = ["test-support"] }
noxide-test-support.workspace = true
noxide-asset-admission.workspace = true
image.workspace = true
tokio = { workspace = true, features = ["test-util"] }
libsqlite3-sys = "0.30.1"
tempfile = "3"
wat = "1"
tower = { version = "0.5", features = ["util"] }
