[package]
name = "noxide-guest"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Runs Noxide guests in separate processes: the wire protocol and the server's worker pool, without a guest runtime"

[dependencies]
noxide-protocol.workspace = true
noxide-host-calls.workspace = true
anyhow.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["io-util", "net", "sync", "time"] }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "test-util"] }
