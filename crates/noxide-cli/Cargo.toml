[package]
name = "noxide-cli"
version.workspace = true
edition.workspace = true
readme.workspace = true
license.workspace = true
repository.workspace = true
description = "Command-line tools for Noxide"
include = ["src/**", "templates/**", "tests/**", "build.rs", "build-kit.bin", "LICENSE-*", "README.md"]

[[bin]]
name = "noxide"
path = "src/main.rs"
doc = false

[[bin]]
name = "noxide-server"
path = "src/bin/noxide-server.rs"
doc = false

[[bin]]
name = "noxide-effects-worker"
path = "src/bin/noxide-effects-worker.rs"
doc = false

[[bin]]
name = "noxide-keyd"
path = "src/bin/noxide-keyd.rs"
doc = false

[dependencies]
noxide.workspace = true
noxide-host.workspace = true
noxide-effect-delivery.workspace = true
noxide-protocol.workspace = true
noxide-asset-admission.workspace = true
noxide-assets.workspace = true
noxide-confine.workspace = true
noxide-keys.workspace = true
anyhow.workspace = true
rustix.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
base64 = "0.22"
tempfile = "3"
sha2.workspace = true
wit-component = "=0.254.0"

[dev-dependencies]
noxide-test-support.workspace = true
tempfile = "3"
wat = "1"
