[package]
name = "noxide-effect-delivery"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Noxide effect delivery over Tor and TLS, run outside the serving process"

[dependencies]
noxide-protocol.workspace = true
noxide-admission.workspace = true
noxide-store.workspace = true
noxide-sql.workspace = true
noxide-effects.workspace = true
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
base64 = "0.22"
rustix.workspace = true
tokio.workspace = true
rustls.workspace = true
tokio-rustls.workspace = true
webpki-roots.workspace = true
httparse.workspace = true

[features]
# Trusted test roots and internals for other crates' tests. Never enabled by a
# deployed binary; tools/check_layers.py verifies the production feature set.
test-support = ["noxide-store/test-support"]

[dev-dependencies]
noxide-store = { workspace = true, features = ["test-support"] }
tokio = { workspace = true, features = ["test-util"] }
tempfile = "3"

[lints]
workspace = true
