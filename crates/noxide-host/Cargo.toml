[package]
name = "noxide-host"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Trusted Noxide application runtime"

[dependencies]
noxide-protocol.workspace = true
noxide-sandbox.workspace = true
noxide-sql.workspace = true
noxide-store.workspace = true
noxide-blobs.workspace = true
noxide-jobs.workspace = true
noxide-repository.workspace = true
noxide-authority.workspace = true
noxide-effects.workspace = true
noxide-assets.workspace = true
noxide-admission.workspace = true
noxide-render.workspace = true
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
rustix.workspace = true
tokio.workspace = true
axum = { version = "0.8", default-features = false, features = ["http1", "tokio"] }
hyper = { version = "1", features = ["http1", "server"] }
hyper-util = { version = "0.1", features = ["tokio", "service"] }
rand = "0.8"
base64 = "0.22"
url = "2"

[features]
query-metrics = ["noxide-store/query-metrics", "noxide-repository/query-metrics"]

[dev-dependencies]
noxide-authority = { workspace = true, features = ["test-support"] }
noxide-jobs = { workspace = true, features = ["test-support"] }
noxide-repository = { workspace = true, features = ["test-support"] }
noxide-blobs = { workspace = true, features = ["test-support"] }
noxide-effect-delivery = { workspace = true, features = ["test-support"] }
rustls.workspace = true
tokio-rustls.workspace = true
httparse.workspace = true
noxide-store = { workspace = true, features = ["test-support"] }
sqlx = { version = "=0.8.6", default-features = false, features = ["runtime-tokio", "sqlite", "postgres"] }
noxide-sql = { workspace = true, features = ["test-support"] }
noxide-admission = { workspace = true, features = ["test-support"] }
noxide-test-support.workspace = true
noxide-asset-admission.workspace = true
image.workspace = true
tokio = { workspace = true, features = ["test-util"] }
libsqlite3-sys = "0.30.1"
tempfile = "3"
wat = "1"
tower = { version = "0.5", features = ["util"] }
