[package]
name = "noxide-sandbox"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Wasmtime boundary and complete guest import surface for Noxide"

[dependencies]
noxide-protocol.workspace = true
noxide-host-calls.workspace = true
anyhow.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["sync", "time"] }
wasmtime = { version = "=48.0.2", default-features = false, features = ["std", "runtime", "cranelift", "component-model", "async"] }
wasmparser = "0.245"

[dev-dependencies]
tokio = { workspace = true, features = ["test-util", "macros", "rt-multi-thread"] }
wat = "1"
