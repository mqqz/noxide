[package]
name = "noxide-cli"
version.workspace = true
edition.workspace = true
readme.workspace = true
license.workspace = true
repository.workspace = true
description = "Command-line tools for Noxide"
include = ["src/**", "templates/**", "tests/**", "build.rs", "build-kit.bin", "LICENSE-*", "README.md"]

[[bin]]
name = "noxide"
path = "src/main.rs"
doc = false

[dependencies]
noxide.workspace = true
noxide-host.workspace = true
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
base64 = "0.22"
tempfile = "3"
sha2.workspace = true
wit-component = "=0.254.0"

[dev-dependencies]
noxide-protocol.workspace = true
tempfile = "3"
wat = "1"
