[workspace]
resolver = "3"
members = [
    "crates/noxide",
    "crates/noxide-cli",
    "crates/noxide-macros",
    "crates/noxide-protocol",
    "crates/noxide-sandbox",
    "crates/noxide-confine",
    "crates/noxide-keys",
    "crates/noxide-assets",
    "crates/noxide-asset-admission",
    "crates/noxide-host",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
readme = "README.md"
license = "MIT OR Apache-2.0"
repository = "https://github.com/mqqz/noxide"

[workspace.dependencies]
noxide = { path = "crates/noxide", version = "0.1.0" }
noxide-macros = { path = "crates/noxide-macros", version = "0.1.0" }
noxide-protocol = { path = "crates/noxide-protocol", version = "0.1.0" }
noxide-assets = { path = "crates/noxide-assets", version = "0.1.0" }
noxide-asset-admission = { path = "crates/noxide-asset-admission", version = "0.1.0" }
noxide-keys = { path = "crates/noxide-keys", version = "0.1.0" }
noxide-confine = { path = "crates/noxide-confine", version = "0.1.0" }
noxide-sandbox = { path = "crates/noxide-sandbox", version = "0.1.0" }
noxide-host = { path = "crates/noxide-host", version = "0.1.0" }
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
cssparser = "=0.38.0"
image = { version = "=0.25.9", default-features = false, features = ["png", "jpeg", "webp"] }
rustls = { version = "=0.23.46", default-features = false, features = ["std", "ring", "tls12"] }
tokio-rustls = { version = "=0.26.6", default-features = false, features = ["ring", "tls12"] }
webpki-roots = "=1.0.11"
httparse = "=1.10.1"
rustix = { version = "=1.1.5", features = ["fs", "process"] }
unicode-normalization = "=0.1.25"
unicode-properties = { version = "=0.1.4", default-features = false, features = ["general-category"] }
tokio = { version = "1.48", features = ["macros", "rt-multi-thread", "net", "signal", "time", "sync", "process", "io-util"] }

[profile.dev]
debug = 0

[profile.test]
debug = 0
